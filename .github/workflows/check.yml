name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sdk-url:
        description: "URL of a Swift SDK for Android artifact bundle (.tar.gz). Leave empty for the released SDK."
        required: false
        default: ""

jobs:
  check:
    name: Check on Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SWIFT_VERSION: 6.4.1
      NDK_VERSION: 30.0.16248370
      RELEASED_SDK_URL: https://download.swift.org/swift-6.4.1-release/android-sdk/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE_android.artifactbundle.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /opt/microsoft /opt/google /opt/az /opt/ghc /usr/share/dotnet /usr/local/share/boost /opt/hostedtoolcache /usr/local/share/chromium
          df -h /

      - name: Install Swift
        run: |
          curl -sSfL "https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2404/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04/usr/bin" >> "$GITHUB_PATH"

      - name: Install the Swift SDK for Android and the NDK
        env:
          SDK_URL: ${{ inputs.sdk-url || env.RELEASED_SDK_URL }}
        run: |
          swift --version
          curl -sSfL -o "$RUNNER_TEMP/sdk.tar.gz" "$SDK_URL"
          echo "SDK: $SDK_URL"
          sha256sum "$RUNNER_TEMP/sdk.tar.gz"
          swift sdk install "$RUNNER_TEMP/sdk.tar.gz"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          SDK_DIR=$(find "$HOME" -maxdepth 7 -type d -path "*swift-sdks/*.artifactbundle/swift-android" | head -1)
          echo "SDK installed at $SDK_DIR"
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" "$SDK_DIR/scripts/setup-android-sdk.sh"
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Build
        run: scripts/build.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # An x86_64 Android 11 image. It runs arm64 and armv7 code through Android's ARM translation.
      - name: Run checks on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Known failures only apply to the released SDK.
          KNOWN_FAILURES: ${{ inputs.sdk-url == '' && 'expected/known-failures-6.4.1.txt' || '/dev/null' }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          script: scripts/run-all.sh "$SDK_DIR" "$KNOWN_FAILURES"
